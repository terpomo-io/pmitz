services:
  pmitz:
    image: terpomo/pmitz-remoteserver:${PMITZ_IMAGE_TAG:-0.10.0}
    ports:
      - "127.0.0.1:${PMITZ_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgresql
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pmitz
      SPRING_DATASOURCE_USERNAME: pmitz
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PMITZ_API_KEY: ${PMITZ_API_KEY:?set PMITZ_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
  postgres:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: pmitz
      POSTGRES_USER: pmitz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmitz -d pmitz"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
